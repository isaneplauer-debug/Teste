<!doctype html>
<html><head><meta charset="utf-8"><title>Memória Perfeita</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// ======================================================================
//  "E se tu acordasse amanhã com memória perfeita?"  — Parte 1
//  Renderer deterministico: render(t) desenha o quadro do tempo t (s).
// ======================================================================
const CHANNEL = '@seucanal';           // <- troque pelo @ do canal
const KEY = '#3fe0ff';                 // cor das palavras-chave
const W = 1080, H = 1920, DURATION = 89;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }

const cache = {};
function layer(key, fn, blur = 0, base = null) {
  if (cache[key]) return cache[key];
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  fn(o.getContext('2d'));
  if (!blur) return cache[key] = o;
  const o2 = document.createElement('canvas'); o2.width = W; o2.height = H;
  const c2 = o2.getContext('2d');
  if (base) { c2.fillStyle = base; c2.fillRect(0, 0, W, H); }
  c2.filter = `blur(${blur}px)`; c2.drawImage(o, 0, 0);
  return cache[key] = o2;
}
function cam(cx, cy, z, fn, rot = 0) {
  if (z >= 1) { cx = clamp(cx, W / 2 / z, W - W / 2 / z); cy = clamp(cy, H / 2 / z, H - H / 2 / z); }
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); if (rot) ctx.rotate(rot);
  ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function shake(t, amp, t0, dur) {
  const k = 1 - prog(t, t0, t0 + dur); if (t < t0 || k <= 0) return [0, 0];
  return [(hash(t * 91) - .5) * amp * k, (hash(t * 57 + 3) - .5) * amp * k];
}

// ---------- palettes ----------
const PAL = {
  lia: { skin: '#E7A06A', skinD: '#CF8752', hair: '#3B2621', shirt: '#F4BF2A', shirtD: '#D9A316', pants: '#56668A', shoe: '#2B2B33', hairType: 'bun', text: CHANNEL },
  g1: { skin: '#C98B5C', skinD: '#B27447', hair: '#1F1A1A', shirt: '#3FA56B', shirtD: '#2E8A56', pants: '#3D4560', shoe: '#222', hairType: 'short' },
  g2: { skin: '#F0C09A', skinD: '#DDA27A', hair: '#7A4A2A', shirt: '#E2574C', shirtD: '#C24237', pants: '#2F3A52', shoe: '#222', hairType: 'bun' },
  g3: { skin: '#8E5A3B', skinD: '#77492F', hair: '#141010', shirt: '#4A7BD9', shirtD: '#3964BD', pants: '#4B4B55', shoe: '#222', hairType: 'curly' },
  g4: { skin: '#E3A877', skinD: '#C98C5C', hair: '#C9A24A', shirt: '#A35BD6', shirtD: '#8746B9', pants: '#334', shoe: '#222', hairType: 'short' },
  g5: { skin: '#B9784C', skinD: '#9E643D', hair: '#2A1E1A', shirt: '#F08A3C', shirtD: '#D2722A', pants: '#3a3f55', shoe: '#222', hairType: 'curly' },
};

// ---------- hologram head ----------
function holo(c, x, y, r, t, k = 1) {
  c.save(); c.globalAlpha *= k;
  const g = c.createRadialGradient(x, y, r * .1, x, y, r);
  g.addColorStop(0, 'rgba(120,200,255,0.55)'); g.addColorStop(.7, 'rgba(30,70,140,0.75)'); g.addColorStop(1, 'rgba(15,30,80,0.9)');
  circ(c, x, y, r); c.fillStyle = g; c.fill();
  c.lineWidth = r * .045; c.strokeStyle = '#F3D49A'; c.stroke();
  circ(c, x, y, r * .93); c.lineWidth = r * .012; c.strokeStyle = 'rgba(200,240,255,.6)'; c.stroke();
  // brain outline
  c.save(); c.translate(x, y - r * .08); c.strokeStyle = 'rgba(190,235,255,.85)'; c.lineWidth = r * .03;
  c.shadowColor = '#7fdcff'; c.shadowBlur = r * .25;
  c.beginPath(); c.ellipse(0, 0, r * .62, r * .45, 0, Math.PI * .95, Math.PI * 2.05); c.stroke();
  c.beginPath(); c.moveTo(-r * .62, r * .02); c.quadraticCurveTo(-r * .4, r * .45, 0, r * .3); c.quadraticCurveTo(r * .4, r * .45, r * .62, r * .02); c.stroke();
  for (let i = 0; i < 5; i++) { c.beginPath(); const a = -r * .45 + i * r * .22; c.moveTo(a, -r * .3); c.quadraticCurveTo(a + r * .12, -r * .05, a - r * .02, r * .2); c.lineWidth = r * .015; c.stroke(); }
  // hippocampus (seahorse curve) glowing
  c.lineWidth = r * .07; c.strokeStyle = '#9ff3ff'; c.shadowBlur = r * .4;
  c.beginPath(); c.moveTo(-r * .25, -r * .02); c.bezierCurveTo(-r * .32, r * .3, r * .18, r * .35, r * .22, r * .08); c.bezierCurveTo(r * .25, -r * .1, r * .05, -r * .12, r * .06, r * .02); c.stroke();
  c.restore();
  for (let i = 0; i < 26; i++) {
    const a = hash(i) * 6.283, d = Math.sqrt(hash(i + 9)) * r * .8, tw = .5 + .5 * Math.sin(t * 6 + i * 2.1);
    circ(c, x + Math.cos(a) * d, y + Math.sin(a) * d * .8, r * .018 * (1 + tw)); c.fillStyle = `rgba(220,250,255,${.35 + .6 * tw})`; c.fill();
  }
  c.restore();
}

// ---------- character ----------
// origin = hip center. Head center at (0,-360). Options:
// pal, s, pose: stand|sit|lie, eyes: closed|open|half|wide|sad|determined|tired|side, mouth: smile|smirk|o|flat|frown|yawn|grin
// armL/armR: [upper,fore] angles (rad, 0=down, + = outward); holo: 0..1; sketch; tilt; blur
function drawChar(c, o, t = 0) {
  const pal = o.pal || PAL.lia, sk = !!o.sketch;
  c.save(); c.translate(o.x, o.y); c.scale(o.s || 1, o.s || 1); if (o.rot) c.rotate(o.rot);
  if (o.alpha != null) c.globalAlpha *= o.alpha;
  const F = (fill) => {
    if (sk) { c.fillStyle = 'rgba(225,232,245,0.10)'; c.fill(); c.strokeStyle = 'rgba(110,122,145,0.95)'; c.lineWidth = 5; c.setLineDash([16, 10]); c.stroke(); c.setLineDash([]); }
    else { c.fillStyle = fill; c.fill(); }
  };
  // shadow on ground
  if (!sk && o.pose !== 'lie' && !o.noShadow) { c.beginPath(); c.ellipse(0, o.pose === 'sit' ? 250 : 285, 150, 26, 0, 0, 6.283); c.fillStyle = 'rgba(0,0,0,.18)'; c.fill(); }
  // legs
  if (o.pose === 'sit') {
    for (const sx of [-1, 1]) {
      rr(c, sx * 50 - 31, -20, 62, 80, 28); F(pal.pants);
      rr(c, sx * 52 - 24, 45, 48, 190, 22); F(pal.skin);
      c.beginPath(); c.ellipse(sx * 54, 242, 40, 17, 0, 0, 6.283); F(pal.shoe);
    }
  } else if (o.pose !== 'lie') {
    const step = o.walk ? Math.sin(t * 9) * 14 : 0;
    for (const sx of [-1, 1]) {
      rr(c, sx * 48 - 30, -20, 60, 155, 26); F(pal.pants);
      rr(c, sx * 48 - 23, 125, 46, 140 + sx * step * .3, 22); F(pal.skin);
      c.beginPath(); c.ellipse(sx * 52, 272 + sx * step * .3, 42, 18, 0, 0, 6.283); F(pal.shoe);
    }
  }
  const arm = (sx, ang) => {
    const [a, b] = ang || [0.12, 0.05];
    const sxp = sx * 92, syp = -212;
    const ex = sxp + sx * Math.sin(a) * 120, ey = syp + Math.cos(a) * 120;
    const hx = ex + sx * Math.sin(b) * 105, hy = ey + Math.cos(b) * 105;
    c.lineCap = 'round';
    if (sk) { c.strokeStyle = 'rgba(110,122,145,0.95)'; c.lineWidth = 5; c.setLineDash([16, 10]);
      c.beginPath(); c.moveTo(sxp, syp); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke(); c.setLineDash([]);
      circ(c, hx, hy, 24); F(); return [hx, hy]; }
    c.strokeStyle = pal.shirtD; c.lineWidth = 50; c.beginPath(); c.moveTo(sxp, syp); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle = pal.skin; c.lineWidth = 40; c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    circ(c, hx, hy, 25); c.fillStyle = pal.skin; c.fill();
    return [hx, hy];
  };
  // torso
  c.beginPath(); c.moveTo(-100, -200); c.quadraticCurveTo(-104, -255, -40, -258); c.lineTo(40, -258); c.quadraticCurveTo(104, -255, 100, -200);
  c.lineTo(112, 0); c.quadraticCurveTo(0, 22, -112, 0); c.closePath(); F(pal.shirt);
  if (!sk) {
    rr(c, -62, -95, 124, 62, 22); c.fillStyle = pal.shirtD; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-24, -245); c.lineTo(-27, -185); c.moveTo(24, -245); c.lineTo(27, -185); c.stroke();
    if (pal.text) { c.font = '600 30px "RC"'; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.8)'; c.fillText(pal.text, 0, -138); }
  }
  const hands = { L: arm(-1, o.armL), R: arm(1, o.armR) };
  // neck
  if (!sk) { rr(c, -22, -285, 44, 40, 10); c.fillStyle = pal.skinD; c.fill(); }
  // head
  c.save(); c.translate(0, -360); if (o.tilt) c.rotate(o.tilt);
  const hk = o.holo || 0;
  if (hk < .99) {
    // bun / hair back
    if (pal.hairType === 'bun') { circ(c, 0, -118, 44); F(pal.hair); }
    if (pal.hairType === 'curly') { for (let i = 0; i < 7; i++) { circ(c, -80 + i * 27, -82 - Math.sin(i * 1.3) * 12, 34); F(pal.hair); } }
    circ(c, 0, 0, 105); F(pal.skin);
    if (!sk) {
      c.save(); circ(c, 0, 0, 105); c.clip();
      c.beginPath(); c.ellipse(0, pal.hairType === 'short' ? -98 : -92, 130, pal.hairType === 'short' ? 58 : 66, 0, 0, 6.283); c.fillStyle = pal.hair; c.fill();
      if (pal.hairType === 'bun') { c.beginPath(); c.ellipse(-92, -10, 26, 62, .15, 0, 6.283); c.fill(); c.beginPath(); c.ellipse(92, -10, 26, 62, -.15, 0, 6.283); c.fill(); }
      c.restore();
      face(c, o, t);
    }
  }
  if (hk > 0) holo(c, 0, 0, 122, t, hk);
  c.restore();
  c.restore();
  return hands;
}
function face(c, o, t) {
  const ey = 12, ex = 34, e = o.eyes || 'open', m = o.mouth || 'smile';
  const blink = o.noBlink ? 0 : ((t * 1.0 + (o.x || 0) * .001) % 3.7 < .1);
  c.fillStyle = '#1E1514'; c.strokeStyle = '#1E1514'; c.lineCap = 'round';
  const browY = -22;
  const brow = (dl, dr, lift = 0) => { c.lineWidth = 7;
    c.beginPath(); c.moveTo(-ex - 16, browY - lift + dl); c.lineTo(-ex + 14, browY - lift - dl); c.stroke();
    c.beginPath(); c.moveTo(ex - 14, browY - lift - dr); c.lineTo(ex + 16, browY - lift + dr); c.stroke(); };
  if (e === 'closed' || blink && e !== 'wide') {
    c.lineWidth = 6; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * ex, ey - 4, 12, .2, Math.PI - .2); c.stroke(); }
    if (e === 'closed') brow(0, 0, -2);
  } else if (e === 'wide') {
    for (const s of [-1, 1]) { circ(c, s * ex, ey, 19); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3; c.stroke(); circ(c, s * ex + 2, ey + 2, 8); c.fillStyle = '#1E1514'; c.fill(); }
    brow(-2, -2, 14);
  } else {
    const look = o.look || 0;
    for (const s of [-1, 1]) { circ(c, s * ex + look, ey, 9); c.fill(); }
    if (e === 'half' || e === 'tired') {
      c.fillStyle = o.pal ? o.pal.skin : PAL.lia.skin;
      for (const s of [-1, 1]) { c.fillRect(s * ex - 14, ey - 14, 28, 13); }
      c.lineWidth = 5; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * ex - 14, ey - 1); c.lineTo(s * ex + 14, ey - 1); c.stroke(); }
      if (e === 'half') { c.lineWidth = 7; c.beginPath(); c.moveTo(-ex - 16, browY + 6); c.lineTo(-ex + 14, browY + 4); c.stroke(); c.beginPath(); c.moveTo(ex - 14, browY - 10); c.quadraticCurveTo(ex, browY - 16, ex + 16, browY - 8); c.stroke(); }
      if (e === 'tired') { c.strokeStyle = 'rgba(90,40,60,.55)'; c.lineWidth = 5; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * ex, ey + 8, 15, .3, Math.PI - .3); c.stroke(); } c.strokeStyle = '#1E1514'; brow(4, 4, -2); }
    } else if (e === 'sad') brow(8, 8, 2);
    else if (e === 'determined') brow(-8, -8, -2);
    else brow(0, 0, 2);
  }
  c.fillStyle = '#1E1514'; c.strokeStyle = '#1E1514'; c.lineWidth = 6;
  const my = 52;
  if (m === 'smile') { c.beginPath(); c.arc(0, my - 14, 18, .35, Math.PI - .35); c.stroke(); }
  else if (m === 'grin') { c.beginPath(); c.arc(0, my - 10, 22, 0, Math.PI); c.closePath(); c.fill(); }
  else if (m === 'smirk') { c.beginPath(); c.moveTo(-14, my); c.quadraticCurveTo(6, my + 6, 20, my - 8); c.stroke(); }
  else if (m === 'o') { c.beginPath(); c.ellipse(0, my, 8, 11, 0, 0, 6.283); c.fill(); }
  else if (m === 'yawn') { c.beginPath(); c.ellipse(0, my + 4, 14, 20, 0, 0, 6.283); c.fill(); }
  else if (m === 'flat') { c.beginPath(); c.moveTo(-14, my); c.lineTo(14, my); c.stroke(); }
  else if (m === 'frown') { c.beginPath(); c.arc(0, my + 14, 16, Math.PI + .5, -.5); c.stroke(); }
  else if (m === 'wavy') { c.beginPath(); c.moveTo(-18, my); c.quadraticCurveTo(-9, my - 7, 0, my); c.quadraticCurveTo(9, my + 7, 18, my); c.stroke(); }
}

// ---------- backgrounds ----------
function woodFloor(c, y0, col = '#8B5E3C', h = H) {
  c.fillStyle = col; c.fillRect(0, y0, W, h - y0);
  c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 3;
  for (let y = y0 + 40, i = 0; y < h; y += 46 + i * 2, i++) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    for (let k = 0; k < 4; k++) { const x = hash(i * 7 + k) * W; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 46); c.stroke(); } }
}
function photoString(c, y, x0 = 60, x1 = 1020) {
  c.strokeStyle = 'rgba(60,40,30,.7)'; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, y); c.quadraticCurveTo((x0 + x1) / 2, y + 60, x1, y); c.stroke();
  const cols = ['#4a78c4', '#d9573f', '#3f9a62', '#9b5cc9', '#e2a63b'];
  for (let i = 0; i < 6; i++) { const u = (i + .5) / 6, x = lerp(x0, x1, u), yy = y + 4 * 60 * u * (1 - u) * .5 + 8;
    c.save(); c.translate(x, yy); c.rotate((hash(i + 40) - .5) * .25); c.fillStyle = '#f6f1e7'; c.fillRect(-30, 0, 60, 66); c.fillStyle = cols[i % 5]; c.fillRect(-23, 7, 46, 42); c.restore(); }
}
function pennant(c, x, y) { const cols = ['#3c8f5a', '#e2b33c', '#d24b3d']; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(x, y + i * 26); c.lineTo(x + 190 - i * 40, y + 40 + i * 6); c.lineTo(x, y + 26 + i * 26); c.fillStyle = cols[i]; c.fill(); } }
function clock(c, x, y, r) { circ(c, x, y, r); c.fillStyle = '#f7f2e8'; c.fill(); c.lineWidth = 10; c.strokeStyle = '#4a3428'; c.stroke();
  c.lineWidth = 6; c.strokeStyle = '#2b2b2b'; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - r * .6); c.moveTo(x, y); c.lineTo(x + r * .45, y + r * .2); c.stroke(); }
function shelf(c, x, y, w) {
  c.fillStyle = '#9b6a45'; c.fillRect(x, y, w, 18); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x, y + 18, w, 10);
  const bc = ['#c9483b', '#3d6fb8', '#e2b33c', '#3f9a62', '#7a4fb0'];
  for (let i = 0; i < 5; i++) { c.fillStyle = bc[i]; c.fillRect(x + 20 + i * 30, y - 120 + (i % 2) * 12, 26, 120 - (i % 2) * 12); }
  c.fillStyle = '#d8b246'; rr(c, x + w - 90, y - 90, 50, 50, 8); c.fill(); c.fillRect(x + w - 72, y - 40, 14, 30); c.fillRect(x + w - 88, y - 14, 46, 14);
}
function wall(c, top, bot) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(0, 0, W, H); }

const BG = {
  bedTop: c => {
    woodFloor(c, 0, '#8E5F3D');
    c.fillStyle = '#E6D0AA'; c.fillRect(0, 0, W, 175); c.fillStyle = '#F1E4CC'; c.fillRect(0, 165, W, 18);
    photoString(c, 30, 140, 940);
    c.fillStyle = 'rgba(0,0,0,.25)'; rr(c, 175, 205, 750, 1760, 40); c.fill();
    c.fillStyle = '#5B3A27'; rr(c, 160, 170, 760, 80, 18); c.fill();
    c.fillStyle = '#6E4730'; rr(c, 160, 230, 760, 1720, 30); c.fill();
    c.fillStyle = '#F3EFE8'; rr(c, 182, 245, 716, 1690, 26); c.fill();
    c.fillStyle = 'rgba(0,0,0,.12)'; rr(c, 318, 300, 444, 250, 100); c.fill();
    c.fillStyle = '#FBFAF7'; rr(c, 310, 285, 444, 245, 100); c.fill();
    c.fillStyle = '#7a5035'; rr(c, 945, 260, 135, 170, 14); c.fill(); circ(c, 1010, 330, 40); c.fillStyle = '#f2d38a'; c.fill();
  },
  blanket: c => { // drawn in front of character (top view)
    c.fillStyle = '#4C6DAC'; rr(c, 182, 860, 716, 1075, 40); c.fill();
    c.fillStyle = '#6886C2'; rr(c, 182, 860, 716, 70, 30); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 10; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(250 + i * 130, 1000 + i * 40); c.quadraticCurveTo(300 + i * 120, 1300, 260 + i * 140, 1800); c.stroke(); }
  },
  room: c => {
    wall(c, '#EAD5B0', '#D8BB8E'); photoString(c, 230);
    pennant(c, 820, 380); clock(c, 230, 560, 75); shelf(c, 560, 700, 330);
    c.fillStyle = '#F1E4CC'; c.fillRect(0, 1380, W, 22); woodFloor(c, 1402);
    // bed (we sit on its edge)
    c.fillStyle = '#5B3A27'; rr(c, -40, 900, 1160, 120, 20); c.fill();
    c.fillStyle = '#EDE8E0'; rr(c, -40, 1010, 1160, 170, 30); c.fill();
    c.fillStyle = '#4C6DAC'; rr(c, -40, 1080, 1160, 330, 40); c.fill();
    c.fillStyle = '#6886C2'; rr(c, -40, 1080, 1160, 50, 30); c.fill();
  },
  wall: c => { wall(c, '#EAD5B0', '#D8BB8E'); photoString(c, 200); clock(c, 860, 520, 70); c.fillStyle = '#F1E4CC'; c.fillRect(0, 1480, W, 22); woodFloor(c, 1502); },
  living: c => {
    wall(c, '#CBD7C3', '#B8C6AE');
    c.fillStyle = '#f5efe2'; c.fillRect(170, 330, 300, 220); c.fillStyle = '#d7894f'; c.fillRect(190, 350, 260, 180); c.fillStyle = '#f1c25a'; circ(c, 380, 410, 40); c.fill();
    c.fillStyle = '#F2EBDD'; c.fillRect(0, 1420, W, 22); woodFloor(c, 1442, '#9A6B47');
    c.fillStyle = '#B54C3A'; rr(c, 60, 960, 960, 280, 60); c.fill();
    c.fillStyle = '#C9573F'; rr(c, 40, 1150, 1000, 230, 50); c.fill();
    c.fillStyle = '#D96A4F'; rr(c, 120, 1120, 400, 110, 40); c.fill(); rr(c, 560, 1120, 400, 110, 40); c.fill();
    c.fillStyle = '#2a1a14'; c.fillRect(90, 1380, 900, 40);
    c.fillStyle = '#5a8f4e'; for (let i = 0; i < 6; i++) { c.beginPath(); c.ellipse(980 + Math.cos(i) * 40, 820 + i * 22, 30, 80, i * .5 - 1.4, 0, 6.283); c.fill(); }
    c.fillStyle = '#c6703f'; rr(c, 930, 930, 110, 120, 14); c.fill();
  },
  sofaLow: c => {
    woodFloor(c, 1000, '#946443');
    // perspective floor lines
    c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 4; for (let i = -8; i <= 8; i++) { c.beginPath(); c.moveTo(540 + i * 40, 1050); c.lineTo(540 + i * 260, H); c.stroke(); }

function drawCaption(t) {
  const cap = CAPS.find(c => t >= c[0] && t < c[1]); if (!cap) return;

  ctx.font = '800 84px "RC"'; ctx.textBaseline = 'middle';
  const widths = parts.map(p => ctx.measureText(p[0]).width), tot = widths.reduce((a, b) => a + b, 0);

function neuron(c, x, y, r, col, flip = 1, seed = 0) {
  c.save(); c.translate(x, y); c.scale(flip, 1); c.strokeStyle = col; c.fillStyle = col; c.lineCap = 'round';
  for (let i = 0; i < 7; i++) { const a = Math.PI * .55 + (i / 6) * Math.PI * .9 + (hash(seed + i) - .5) * .3, L = r * (2 + hash(seed + i + 9) * 1.6);
    c.lineWidth = r * .22; c.beginPath(); c.moveTo(0, 0); const ex = Math.cos(a) * L, ey = Math.sin(a) * L; c.quadraticCurveTo(Math.cos(a + .3) * L * .5, Math.sin(a + .3) * L * .5, ex, ey); c.stroke();
    c.lineWidth = r * .1; for (let j = 0; j < 2; j++) { const b = a + (j ? .5 : -.5); c.beginPath(); c.moveTo(ex * .7, ey * .7); c.lineTo(ex * .7 + Math.cos(b) * L * .4, ey * .7 + Math.sin(b) * L * .4); c.stroke(); } }
  c.shadowColor = col; c.shadowBlur = r; circ(c, 0, 0, r); c.fill(); c.shadowBlur = 0; circ(c, 0, 0, r * .38); c.fillStyle = '#d0406a'; c.fill();
  c.restore();
}

function synapseShot(t, strength, z, cx) {
  cam(cx, 960, z, () => {
    img(layer('neural', BG.neural));
    const col = '#F28A6B';
    neuron(ctx, 160, 960, 70, col, 1, 1); neuron(ctx, 920, 960, 70, col, -1, 5);
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(230, 960); ctx.lineTo(500, 960); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(850, 960); ctx.lineTo(590, 960); ctx.stroke();

    circ(ctx, 510, 960, 34); ctx.fillStyle = col; ctx.fill(); circ(ctx, 580, 960, 30); ctx.fill();
    // bridge (connection strength)
    ctx.save(); ctx.shadowColor = KEY; ctx.shadowBlur = 30 + 60 * strength; ctx.strokeStyle = `rgba(140,235,255,${.35 + .6 * strength})`; ctx.lineWidth = 6 + 34 * strength;
    ctx.beginPath(); ctx.moveTo(530, 960); ctx.lineTo(562, 960); ctx.stroke(); ctx.restore();
    // pulses traveling

    if (ph > .78) for (let i = 0; i < 8; i++) { const q = (ph - .78) / .22; pulseDot(ctx, 545 + Math.cos(i) * 60 * q, 960 + Math.sin(i * 1.7) * 60 * q, 18, 1 - q); }
  });
}
